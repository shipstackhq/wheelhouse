# Everything on one machine with nothing else on it: Postgres, the app and Caddy.
#
#   cp .env.standalone.example .env      # fill in the three values at the top
#   docker compose -f docker-compose.standalone.yml up -d
#
# The app is the same image the VPS deploy uses (the API serves the React app). Caddy is the only thing that listens on the
# host. Migrations run when the app boots, so never run more than one app replica. See docs/deploy.md.
name: wheelhouse
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wheelhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wheelhouse
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelhouse -d wheelhouse"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${WHEELHOUSE_IMAGE:-ghcr.io/shipstackhq/wheelhouse:latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://wheelhouse:${POSTGRES_PASSWORD}@postgres:5432/wheelhouse
      APP_URL: ${APP_URL:?set APP_URL in .env to the address people will use}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
