<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wheelhouse</title>
    <meta name="description" content="Kanban boards and architecture maps your team and your AI agents share." />
    <meta name="application-name" content="Wheelhouse" />
    <meta name="theme-color" content="#0f0f10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wheelhouse" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Runs before first paint so there is no dark -> light flash.
      (function(){try{var m=localStorage.getItem("wh_theme")||"system";var l=m==="light"||(m==="system"&&window.matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.dataset.theme=l?"light":"dark";document.querySelector('meta[name=theme-color]').content=l?"#ffffff":"#0f0f10"}catch(e){document.documentElement.dataset.theme="dark"}})()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
