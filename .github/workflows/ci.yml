name: CI

on:
  pull_request:
  push:
    branches: [development, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What this run has to test. A push to staging or production tests everything. A pull request that only touches the web app or
  # docs skips the server-side suites (core, api, the root tests, Postgres), which cannot be affected and take most of the time.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.diff.outputs.server }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "$changed"
          # Anything outside apps/web, docs or Markdown files can affect the server side.
          if echo "$changed" | grep -qvE '^(apps/web/|docs/)|\.md$'; then server=true; else server=false; fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "server-side suites: $server"
          # The web app depends on itself, the shared packages, the lockfile and CI.
          if echo "$changed" | grep -qE '^(apps/web/|packages/|pnpm-lock\.yaml|package\.json|\.github/)'; then web=true; else web=false; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, types, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations are in sync with the schema
        run: |
          pnpm db:generate
          git status --porcelain apps/api/drizzle
          test -z "$(git status --porcelain apps/api/drizzle)" || { echo "::error::apps/api/src/db/schema.ts changed without a migration. Run pnpm db:generate and commit apps/api/drizzle/."; exit 1; }
      - name: The React app builds
        run: pnpm build

  # The test suites, split so they run at the same time instead of one after another. The runner has 2 cores, so each job runs two
  # test files at once. Together these run exactly what `pnpm test` runs.
  api-tests:
    name: API tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: pnpm exec tsx --test --test-force-exit --test-concurrency=2 --test-shard=${{ matrix.shard }}/3 "src/**/*.test.ts"

  web-tests:
    name: Web tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2 --maxWorkers=2

  server-tests:
    name: Shared, client and repository tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wheelhouse/shared test
      - run: pnpm --filter @wheelhouse/api-client test
      - run: pnpm exec tsx --conditions=react-server --test --test-concurrency=2 "tests/*.test.ts"

  postgres-tests:
    name: Database suites on a real Postgres
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A real Postgres for the database suites: the in-memory test database is more forgiving than the
      # production driver (it once hid a query that failed for every new API key).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wheelhouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Queue, invites, admin, isolation, constraints, join tables, cycles, projects
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/wheelhouse_test
        run: >-
          pnpm exec tsx --conditions=react-server --test --test-force-exit --test-concurrency=1
          apps/api/src/lib/queue.test.ts tests/invites.test.ts apps/api/src/lib/workspaces-admin.test.ts tests/isolation.test.ts
          apps/api/src/lib/version-lock.test.ts apps/api/src/tools/db-copy.test.ts apps/api/src/lib/workspace-scope.test.ts
          apps/api/src/lib/constraints.test.ts apps/api/src/lib/join-tables.test.ts apps/api/src/lib/cycles.test.ts apps/api/src/lib/projects.test.ts apps/api/src/lib/initiatives.test.ts apps/api/src/lib/team-access.test.ts

  # One check that says whether everything above passed, skipped suites counting as passed. Point branch rules here.
  tests:
    name: Lint, types, tests, build
    if: always()
    needs: [changes, check, api-tests, web-tests, server-tests, postgres-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"(failure|cancelled)"'; then exit 1; fi

  image:
    name: Image builds, migrates a fresh Postgres, serves health
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wheelhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wheelhouse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image against an empty database
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://postgres:ci@127.0.0.1:5432/wheelhouse \
            -e APP_URL=http://127.0.0.1:3000 \
            wheelhouse:ci
      - name: Health is 200 once migrations have applied
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: "The same container serves the React app and the API"
        run: |
          curl -fsS http://127.0.0.1:3000/t/WH/map | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/app/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/missing-123.js)" = 404
      - name: Every migration was applied
        run: |
          expected=$(node -p "require('./apps/api/drizzle/meta/_journal.json').entries.length")
          applied=$(docker exec -e PGPASSWORD=ci $(docker ps -qf ancestor=postgres:18) psql -U postgres -d wheelhouse -tAc 'select count(*) from drizzle.__drizzle_migrations')
          echo "expected=$expected applied=$applied"
          test "$expected" = "$applied"

  packaged:
    name: The packaged app behind Caddy (smoke test and the contract suite)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Standalone stack: the app, a live stream through Caddy, backup and restore"
        run: deploy/smoke-test.sh
      - name: "The contract suite against the image, on Postgres, behind Caddy"
        run: deploy/contract-in-docker.sh
