name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A real Postgres for the database suites: the in-memory test database is more forgiving than the
      # production driver (it once hid a query that failed for every new API key).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wheelhouse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Database suites on a real Postgres (queue, invites, admin, isolation)
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/wheelhouse_test
        run: >-
          pnpm exec tsx --conditions=react-server --test --test-force-exit --test-concurrency=1
          packages/core/src/lib/queue.test.ts src/lib/invites.test.ts packages/core/src/lib/teams-admin.test.ts src/lib/isolation.test.ts
          packages/core/src/lib/version-lock.test.ts
      - name: Migrations are in sync with the schema
        run: |
          pnpm db:generate
          git status --porcelain packages/core/drizzle
          test -z "$(git status --porcelain packages/core/drizzle)" || { echo "::error::packages/core/src/db/schema.ts changed without a migration. Run pnpm db:generate and commit packages/core/drizzle/."; exit 1; }
      - run: pnpm build
      - name: The React app builds
        run: pnpm --filter @wheelhouse/web build

  image:
    name: Image builds, migrates a fresh Postgres, serves health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wheelhouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wheelhouse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image against an empty database
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://postgres:ci@127.0.0.1:5432/wheelhouse \
            -e APP_URL=http://127.0.0.1:3000 \
            wheelhouse:ci
      - name: Health is 200 once migrations have applied
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: "The same container serves the React app and the API"
        run: |
          curl -fsS http://127.0.0.1:3000/p/WH/map | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/app/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/missing-123.js)" = 404
      - name: Every migration was applied
        run: |
          expected=$(node -p "require('./packages/core/drizzle/meta/_journal.json').entries.length")
          applied=$(docker exec -e PGPASSWORD=ci $(docker ps -qf ancestor=postgres:18) psql -U postgres -d wheelhouse -tAc 'select count(*) from drizzle.__drizzle_migrations')
          echo "expected=$expected applied=$applied"
          test "$expected" = "$applied"

  packaged:
    name: The packaged app behind Caddy (smoke test and the contract suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Standalone stack: the app, a live stream through Caddy, backup and restore"
        run: deploy/smoke-test.sh
      - name: "The contract suite against the image, on Postgres, behind Caddy"
        run: deploy/contract-in-docker.sh
