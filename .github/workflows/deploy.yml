name: Deploy

# Runs after CI passes on main. Builds the image once, pushes it to GHCR tagged with the commit SHA,
# then deploys that exact tag to the VPS over SSH, through a locked-down key that can only run the server's
# deploy wrapper (which runs deploy/deploy.sh: dump, swap, health gate, rollback).
# Manual run with `sha` redeploys an already-published image (use it to roll back).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA of an already-published image to deploy (leave empty to build and deploy main)"
        required: false
      dry_run:
        description: "Dry run: build the image (not pushed) and check the deploy configuration, without logging in to the registry or touching the server"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and push image
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sha == '' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: publish
    # Run when the image was just built, or when publish was skipped on purpose (manual redeploy of a SHA). Never on a dry run.
    if: ${{ always() && !inputs.dry_run && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production   # add required reviewers here for a manual approval gate
    steps:
      - name: Check the SHA is a full commit hash
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SHA' is not a 40-character commit SHA"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the connection fails if the server is not the one in the secret.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        # The key is locked on the server to one root-owned wrapper (authorized_keys `command=`), which reads three
        # lines from stdin: the commit SHA, the GitHub user and the job token. It logs in to GHCR, runs deploy.sh and
        # logs out. The compose file, scripts and .env live on the server, root-owned: this job uploads nothing.
        run: |
          printf '%s\n%s\n%s\n' "$SHA" "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}

  dry-run:
    name: Dry run (nothing is pushed or deployed)
    needs: publish
    if: ${{ always() && inputs.dry_run && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: What would be deployed, and is everything in place to do it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          echo "Would deploy $IMAGE:$SHA"
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::warning::secret $v is not set in the production environment"; missing=1; fi
          done
          bash -n deploy/deploy.sh deploy/backup.sh deploy/restore.sh
          touch .env && POSTGRES_NETWORK=x docker compose -f docker-compose.yml config -q && echo "docker-compose.yml is valid"
          echo "The server was not contacted and nothing was pushed."
          exit $missing
